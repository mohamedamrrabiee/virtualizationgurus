baseURL = "https://mohamedamrrabiee.github.io/virtualizationgurus/"
languageCode = "en-us"
title = "Virtualization Gurus"
theme = "PaperMod"

[params]
description = "Expert insights on VMware, VCF, and enterprise virtualization"
author = "Mohamed Amr Rabiee"
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = true
tocopen = false

# Logo in navbar
[params.logo]
text = "Virtualization Gurus"
url  = "/"
logoText = "VG"

# Homepage hero disabled (using _index.md instead for full control)
[params.homeInfoParams]
Title   = "Virtualization Gurus"
Content = "Expert insights on VMware Cloud Foundation, vSphere, NSX, and enterprise virtualization"

[params.profileMode]
enabled = false

# Social links shown in header/footer
[[params.socialIcons]]
name = "linkedin"
url  = "https://www.linkedin.com/in/mohamedamrrabiee/"

[[params.socialIcons]]
name = "github"
url  = "https://github.com/mohamedamrrabiee"

[[params.socialIcons]]
name = "rss"
url  = "/index.xml"

[menu]
[[menu.main]]
identifier = "home"
name = "Home"
url = "/"
weight = 1
[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 2
[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 3

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
noClasses = false

[pagination]
pagerSize = 10
