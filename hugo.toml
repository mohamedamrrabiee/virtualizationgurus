# Primary site: https://virtualizationgurus.pages.dev/ (Cloudflare Pages; its build overrides baseURL with -b).
# The value below is used by the legacy GitHub Pages build, which redirects visitors to Cloudflare.

baseURL = "https://mohamedamrrabiee.github.io/virtualizationgurus/"
languageCode = "en-us"
title = "Virtualization Gurus"
theme = "PaperMod"
enableRobotsTXT = true
copyright = "© 2026 All rights reserved."

[services.googleAnalytics]
ID = "G-H18T2QZQLY"

[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
mainSections = ["posts"]
description = "Virtualization Gurus: practitioner guides to VMware Cloud Foundation (VCF 9), NSX, vSAN ESA, vSphere, and VCF Operations, by Mohamed Rabiee"
keywords = ["Virtualization Gurus", "VirtualizationGurus", "VCF 9", "VMware Cloud Foundation 9", "VCF 9 series", "NSX", "vSAN ESA", "vSphere", "VCF Operations", "SDDC Manager", "VMware Private AI", "Broadcom VCF", "Mohamed Rabiee"]
author = "Mohamed Rabiee"
ShowReadingTime = false
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = false
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
defaultTheme = "dark"
disableThemeToggle = true
comments = false
hidemeta = false
hideSummary = false
showtoc = true
tocopen = false
seriesTotal = 21

[params.footer]
text = "Every post here reflects my own hands-on lab work and independent research. Opinions are my own and don't reflect my employer's views."

# Logo in navbar
[params.logo]
text = "Virtualization Gurus"
url = "/"
logoText = "VG"
imageUrl = "/images/logo.svg"
imageHeight = 48
imageWidth = 48

# Homepage hero disabled (using _index.md instead for full control)
[params.homeInfoParams]
Title = "Virtualization Gurus"
Content = "Expert insights on VMware Cloud Foundation, vSphere, NSX, and enterprise virtualization"

[params.profileMode]
enabled = false

# Social links shown in header/footer
[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/in/mohamedamrrabiee/"

[[params.socialIcons]]
name = "github"
url = "https://github.com/mohamedamrrabiee"

[[params.socialIcons]]
name = "rss"
url = "/index.xml"

[menu]
[[menu.main]]
identifier = "home"
name = "Home"
url = "/"
weight = 1
[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 2
[[menu.main]]
identifier = "series"
name = "VCF 9 Series"
url = "/vcf9-series/"
weight = 3
[[menu.main]]
identifier = "labseries"
name = "Lab Series"
url = "/lab-series/"
weight = 4
[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 5
[[menu.main]]
identifier = "search"
name = "Search"
url = "/search/"
weight = 6

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
noClasses = false

[pagination]
pagerSize = 10
