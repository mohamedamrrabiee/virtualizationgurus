# TEMPORARY deployment URL (GitHub Pages default, active while eu.org domain is pending):
baseURL = "https://mohamedamrrabiee.github.io/virtualizationgurus/"
languageCode = "en-us"
title = "Virtualization Gurus"
theme = "PaperMod"

[params]
description = "Expert insights on VMware, VCF, and enterprise virtualization"
author = "Mohamed Amr Rabiee"
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = true
tocopen = false

# Logo in navbar
[params.logo]
text = "Virtualization Gurus"
url = "/"
logoText = "VG"
imageUrl = "/virtualizationgurus/images/logo.svg"
imageHeight = 48
imageWidth = 48

# Homepage hero disabled (using _index.md instead for full control)
[params.homeInfoParams]
Title = "Virtualization Gurus"
Content = "Expert insights on VMware Cloud Foundation, vSphere, NSX, and enterprise virtualization"

[params.profileMode]
enabled = false

# Social links shown in header/footer
[[params.socialIcons]]
