{{- /* Published posts of the VCF 9 series, built from each post's seriesPart and date. */ -}}
<ol>
{{- range sort (where site.RegularPages "Params.seriesPart" "ne" nil) "Params.seriesPart" }}
  <li><a href="{{ .RelPermalink }}">{{ .LinkTitle | safeHTML }}</a>, {{ .Date.Format "January 2, 2006" }}</li>
{{- end }}
</ol>
