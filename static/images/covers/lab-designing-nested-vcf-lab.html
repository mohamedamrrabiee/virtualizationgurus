<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', -apple-system, sans-serif; }
  body {
    width:1200px; height:630px;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0f2744 100%);
    position: relative; overflow: hidden;
    display:flex; flex-direction:column; justify-content:space-between;
    padding: 56px 64px;
  }
  .grid-bg {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(45,212,191,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45,212,191,0.05) 1px, transparent 1px);
    background-size: 36px 36px;
  }
  .glow {
    position:absolute; top:-100px; left:-100px; width:420px; height:420px;
    background: radial-gradient(circle, rgba(45,212,191,0.16) 0%, transparent 70%);
  }
  .glow2 {
    position:absolute; bottom:-140px; right:-100px; width:460px; height:460px;
    background: radial-gradient(circle, rgba(52,211,153,0.12) 0%, transparent 70%);
  }
  .row-top { position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:14px; }
  .brand img { height:38px; width:auto; opacity:0.92; }
  .brand-text { font-size:19px; font-weight:800; letter-spacing:0.02em; color:#e2e8f0; }
  .pill {
    display:inline-flex; align-items:center; gap:8px;
    padding: 9px 20px; border-radius:9999px;
    border:1px solid rgba(45,212,191,0.35);
    background: rgba(45,212,191,0.08);
    color:#2dd4bf; font-size:15px; font-weight:700; letter-spacing:0.04em;
  }
  .pill-dot { width:7px; height:7px; border-radius:50%; background:#2dd4bf; box-shadow:0 0 8px rgba(45,212,191,0.8); }
  .center { position:relative; z-index:2; max-width:920px; }
  .title {
    font-size:54px; font-weight:800; line-height:1.12; letter-spacing:-0.02em;
    background: linear-gradient(90deg, #2dd4bf, #34d399);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    margin-bottom:18px;
  }
  .subtitle { font-size:22px; color:#94a3b8; font-weight:500; line-height:1.5; max-width:760px; }
  .row-bottom { position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; }
  .tags { display:flex; gap:10px; flex-wrap:wrap; }
  .tag {
    padding:6px 16px; border-radius:9999px; font-size:14px; font-weight:600;
    background: rgba(45,212,191,0.1); color:#2dd4bf; border:1px solid rgba(45,212,191,0.2);
  }
  .accent-bar {
    height:4px; width:100%; border-radius:4px; margin-top:26px;
    background: linear-gradient(90deg, #2dd4bf, #34d399, #0ea5e9);
  }
  .url { font-size:15px; color:#475569; font-weight:600; letter-spacing:0.03em; }
</style></head>
<body>
  <div class="grid-bg"></div>
  <div class="glow"></div>
  <div class="glow2"></div>

  <div class="row-top">
    <div class="brand">
      <img src="/home/claude/virtualizationgurus/static/images/logo.svg" />
      <div class="brand-text">VIRTUALIZATION GURUS</div>
    </div>
    <div class="pill"><span class="pill-dot"></span>LAB SERIES &middot; POST 1/25</div>
  </div>

  <div class="center">
    <div class="title">Designing a Nested VCF 9.1.1 Lab</div>
    <div class="subtitle">Names, VLANs, sizing and the decisions behind the build</div>
    <div class="accent-bar"></div>
  </div>

  <div class="row-bottom">
    <div class="tags">
      <div class="tag">Lab</div><div class="tag">Design</div><div class="tag">Nested</div><div class="tag">VCF</div>
    </div>
    <div class="url">Hands-on VCF 9.1.1 lab</div>
  </div>
</body></html>
