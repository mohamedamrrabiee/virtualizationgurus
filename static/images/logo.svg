<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="320" height="80" rx="10" ry="10" fill="url(#bgGrad)"/>
  <g transform="translate(12, 10)" filter="url(#glow)">
    <rect x="2" y="2" width="44" height="14" rx="3" fill="none" stroke="url(#iconGrad)" stroke-width="1.5"/>
    <circle cx="8" cy="9" r="2" fill="#38bdf8"/>
    <rect x="14" y="7" width="20" height="4" rx="1" fill="#334155"/>
    <rect x="38" y="7" width="4" height="4" rx="1" fill="#22c55e"/>
    <rect x="2" y="20" width="44" height="14" rx="3" fill="none" stroke="url(#iconGrad)" stroke-width="1.5"/>
    <circle cx="8" cy="27" r="2" fill="#6366f1"/>
    <rect x="14" y="25" width="20" height="4" rx="1" fill="#334155"/>
    <rect x="38" y="25" width="4" height="4" rx="1" fill="#22c55e"/>
    <rect x="2" y="38" width="44" height="14" rx="3" fill="none" stroke="url(#iconGrad)" stroke-width="1.5"/>
    <circle cx="8" cy="45" r="2" fill="#a78bfa"/>
    <rect x="14" y="43" width="20" height="4" rx="1" fill="#334155"/>
    <rect x="38" y="43" width="4" height="4" rx="1" fill="#f59e0b"/>
    <line x1="24" y1="56" x2="24" y2="60" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="8" y1="60" x2="40" y2="60" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="8" cy="60" r="2" fill="#38bdf8"/>
    <circle cx="24" cy="60" r="2" fill="#6366f1"/>
    <circle cx="40" cy="60" r="2" fill="#a78bfa"/>
  </g>
  <line x1="72" y1="12" x2="72" y2="68" stroke="#334155" stroke-width="1"/>
  <text x="82" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="url(#textGrad)">VIRTUALIZATION</text>
  <text x="82" y="54" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#f8fafc">GURUS</text>
  <text x="82" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="8" font-weight="400" letter-spacing="1.2" fill="#64748b">EXPERT VMWARE &amp; VCF INSIGHTS</text>
  <rect x="82" y="57" width="140" height="2" rx="1" fill="url(#textGrad)" opacity="0.5"/>
