<text x="910" y="238" fill="#e2e8f0" font-size="12.5" font-weight="bold">grp-dev-snat</text>
<text x="872" y="256" fill="#94a3b8" font-size="11">IP 10.80.0.1</text>
<text x="872" y="270" fill="#94a3b8" font-size="11">dev-priv01 after SNAT</text>
<text x="24" y="440" fill="#f87171" font-size="11">R4 drop: anything else into grp-app-private.   R5 drop: grp-app-private to grp-app-public.</text>
<text x="24" y="460" fill="#94a3b8" font-size="11">The default Layer 3 rule is Allow, so every block is an explicit rule.  The destination VPC sees 10.80.0.1, not the dev VM.</text>
<text x="24" y="480" fill="#94a3b8" font-size="11">Rule order: R1 and R2 allow the intended paths, R3 removes the dev VPC, R4 and R5 close the private tier in both directions.</text>
