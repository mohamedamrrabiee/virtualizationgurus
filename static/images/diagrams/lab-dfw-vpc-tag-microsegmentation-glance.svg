<rect x="203" y="182" width="159" height="16" rx="3" fill="#0c1222"/><text x="282" y="194" fill="#34d399" font-size="11" text-anchor="middle">R1 allow SSH, HTTP, ICMP</text>
<path d="M550,182 L550,300" fill="none" stroke="#34d399" stroke-width="1.6" marker-end="url(#agreen)"/>
<rect x="489" y="232" width="122" height="16" rx="3" fill="#0c1222"/><text x="550" y="244" fill="#34d399" font-size="11" text-anchor="middle">R2 allow SSH, ICMP</text>
