<rect x="32" y="223" width="34" height="22" rx="4" fill="none" stroke="#94a3b8" stroke-width="1"/><text x="49" y="238" fill="#94a3b8" font-size="9" font-weight="bold" text-anchor="middle">PC</text>
<text x="74" y="238" fill="#e2e8f0" font-size="12.5" font-weight="bold">Management</text>
<text x="36" y="256" fill="#94a3b8" font-size="11">10.20.10.0/24</text>
<rect x="320" y="106" width="460" height="76" rx="7" fill="#10281f" stroke="#34d399" stroke-width="1.5"/>
<rect x="328" y="114" width="34" height="22" rx="4" fill="none" stroke="#34d399" stroke-width="1"/><text x="345" y="129" fill="#34d399" font-size="9" font-weight="bold" text-anchor="middle">NET</text>
<text x="370" y="129" fill="#e2e8f0" font-size="12.5" font-weight="bold">grp-app-public</text>
<text x="332" y="147" fill="#94a3b8" font-size="11">tag public, scope tier</text>
<text x="332" y="161" fill="#94a3b8" font-size="11">app-pub01, app-pub02</text>
<rect x="320" y="300" width="460" height="76" rx="7" fill="#2a2210" stroke="#fbbf24" stroke-width="1.5"/>
<rect x="328" y="308" width="34" height="22" rx="4" fill="none" stroke="#fbbf24" stroke-width="1"/><text x="345" y="323" fill="#fbbf24" font-size="9" font-weight="bold" text-anchor="middle">NET</text>
<text x="370" y="323" fill="#e2e8f0" font-size="12.5" font-weight="bold">grp-app-private</text>
<text x="332" y="341" fill="#94a3b8" font-size="11">tag private, scope tier</text>
<text x="332" y="355" fill="#94a3b8" font-size="11">app-priv01</text>
<rect x="860" y="215" width="236" height="84" rx="7" fill="#2a1418" stroke="#f87171" stroke-width="1.5"/>
<rect x="868" y="223" width="34" height="22" rx="4" fill="none" stroke="#f87171" stroke-width="1"/><text x="885" y="238" fill="#f87171" font-size="9" font-weight="bold" text-anchor="middle">DFW</text>
<text x="910" y="238" fill="#e2e8f0" font-size="12.5" font-weight="bold">grp-dev-snat</text>
<text x="872" y="256" fill="#94a3b8" font-size="11">IP 10.80.0.1</text>
<text x="872" y="270" fill="#94a3b8" font-size="11">dev-priv01 after SNAT</text>
<text x="24" y="440" fill="#f87171" font-size="11">R4 drop: anything else into grp-app-private.   R5 drop: grp-app-private to grp-app-public.</text>
<text x="24" y="460" fill="#94a3b8" font-size="11">The default Layer 3 rule is Allow, so every block is an explicit rule.  The destination VPC sees 10.80.0.1, not the dev VM.</text>
<text x="24" y="480" fill="#94a3b8" font-size="11">Rule order: R1 and R2 allow the intended paths, R3 removes the dev VPC, R4 and R5 close the private tier in both directions.</text>
<text x="1096" y="508" fill="#64748b" font-size="10" text-anchor="end">Virtualization Gurus  |  nested VCF 9.1.1 lab</text></svg>