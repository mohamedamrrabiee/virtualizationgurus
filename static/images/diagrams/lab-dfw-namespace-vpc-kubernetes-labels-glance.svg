<text x="94" y="133" fill="#e2e8f0" font-size="12.5" font-weight="bold">vm-demo01</text>
<text x="56" y="151" fill="#94a3b8" font-size="11">VM Service VM</text>
<text x="56" y="165" fill="#94a3b8" font-size="11">172.21.0.35</text>
<text x="56" y="179" fill="#94a3b8" font-size="11">vm-selector: vm-demo01</text>
