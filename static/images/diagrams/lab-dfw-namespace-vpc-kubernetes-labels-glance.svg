<text x="652" y="165" fill="#94a3b8" font-size="11">tag web-demo2</text>
<text x="652" y="179" fill="#94a3b8" font-size="11">scope app</text>
<rect x="950" y="110" width="130" height="92" rx="7" fill="#132239" stroke="#38bdf8" stroke-width="1.5"/>
<rect x="958" y="118" width="34" height="22" rx="4" fill="none" stroke="#38bdf8" stroke-width="1"/><text x="975" y="133" fill="#38bdf8" font-size="9" font-weight="bold" text-anchor="middle">NS</text>
<text x="1000" y="133" fill="#e2e8f0" font-size="12.5" font-weight="bold">web-demo2</text>
<text x="962" y="151" fill="#94a3b8" font-size="11">3 vSphere Pods</text>
<text x="962" y="165" fill="#94a3b8" font-size="11">172.31.0.34-.36</text>
<text x="962" y="179" fill="#94a3b8" font-size="11">app: web-demo2</text>
<text x="44" y="250" fill="#94a3b8" font-size="11">Two one-way rules, not one rule with both groups on both sides, because that would also drop traffic between pods inside web-demo2.</text>
<text x="44" y="278" fill="#94a3b8" font-size="11">Pods use the private transit gateway block 172.31.0.0/16, the VM uses the namespace private range 172.21.0.0/16.</text>
