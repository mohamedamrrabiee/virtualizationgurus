<text x="658" y="291" fill="#94a3b8" font-size="11">peers .2 and .3</text>
<text x="24" y="385" fill="#94a3b8" font-size="11">The router sends a default route and accepts only prefixes inside 10.80.0.0/22.</text>
<text x="24" y="402" fill="#94a3b8" font-size="11">BFD off, no BGP password, uplink MTU 1500. One router stands in for two top-of-rack switches.</text>
