<text x="872" y="175" fill="#94a3b8" font-size="11">realm vgurus, client vcf</text>
<text x="872" y="189" fill="#94a3b8" font-size="11">group vcf-admins</text>
<text x="872" y="203" fill="#94a3b8" font-size="11">claims: groups, domain</text>
<text x="24" y="360" fill="#94a3b8" font-size="11">1 sign in, 2 redirect to the broker, 3 OIDC authorization code flow and ID token with the groups claim.</text>
<text x="24" y="380" fill="#94a3b8" font-size="11">SDDC Manager UI and ESX hosts keep their own local sign-in. SSO is managed only from VCF Operations once configured.</text>
